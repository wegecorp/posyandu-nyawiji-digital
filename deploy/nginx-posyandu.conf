# Konfigurasi Nginx — Portal Nyawiji (Dinas Kesehatan Kab. Gunungkidul)
#
# Lokasi di server: /etc/nginx/sites-available/posyandu
#   (aktif lewat symlink /etc/nginx/sites-enabled/posyandu)
#
# Bagian bertanda "managed by Certbot" dikelola Certbot — JANGAN diubah.
#
# SAKLAR MAINTENANCE:
#   sudo touch /var/www/maintenance.on   -> seluruh situs balas 503 + halaman pemeliharaan
#   sudo rm    /var/www/maintenance.on   -> situs kembali normal
#
# Halaman pemeliharaan: /var/www/maintenance.html
#   (salin dari repo: sudo cp deploy/maintenance.html /var/www/maintenance.html)

server {
    server_name posyandunyawiji.my.id;

    # Halaman pemeliharaan hanya untuk internal (dipanggil error_page),
    # tidak bisa dibuka langsung dari luar.
    location = /maintenance.html {
        internal;
        root /var/www;
    }

    # Semua respons 503 ditampilkan sebagai halaman pemeliharaan.
    error_page 503 /maintenance.html;

    location / {
        # Saklar maintenance: selama file penanda ada, seluruh situs balas 503.
        if (-f /var/www/maintenance.on) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/posyandunyawiji.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/posyandunyawiji.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = posyandunyawiji.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name posyandunyawiji.my.id;
    return 404; # managed by Certbot
}
