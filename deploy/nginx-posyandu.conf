# Konfigurasi Nginx — Portal Nyawiji (Dinas Kesehatan Kab. Gunungkidul)
#
# Lokasi di server: /etc/nginx/sites-available/posyandu
#   (aktif lewat symlink /etc/nginx/sites-enabled/posyandu)
#
# Bagian bertanda "managed by Certbot" dikelola Certbot — JANGAN diubah.
#
# SAKLAR MAINTENANCE:
#   sudo touch /var/www/maintenance.on   -> seluruh situs balas 503 + halaman pemeliharaan
#   sudo rm    /var/www/maintenance.on   -> situs kembali normal
#
# Halaman pemeliharaan: /var/www/maintenance.html
#   (salin dari repo: sudo cp deploy/maintenance.html /var/www/maintenance.html)

server {
    server_name posyandunyawiji.my.id;

    # Kompresi Gzip hemat bandwidth & CPU
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Halaman pemeliharaan hanya untuk internal (dipanggil error_page),
    # tidak bisa dibuka langsung dari luar.
    location = /maintenance.html {
        internal;
        root /var/www;
    }

    # Semua respons 503 ditampilkan sebagai halaman pemeliharaan.
    error_page 503 /maintenance.html;

    # Aset statis ter-hash Next.js (_next/static/) — cache 1 tahun & hemat RAM Node.js
    location /_next/static/ {
        alias /opt/nyawiji/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @node_app;
    }

    # Service Worker PWA (sw.js) — jangan di-cache agar pembaruan instan
    location = /sw.js {
        root /opt/nyawiji/public;
        expires -1;
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri @node_app;
    }

    # Aset publik statis (logo, favicon, manifest)
    location ~* \.(ico|png|jpg|jpeg|svg|webp|webmanifest)$ {
        root /opt/nyawiji/public;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @node_app;
    }

    # Fallback ke Node.js bila file statis tidak ada di disk
    location @node_app {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        # Saklar maintenance: selama file penanda ada, seluruh situs balas 503.
        if (-f /var/www/maintenance.on) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/posyandunyawiji.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/posyandunyawiji.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = posyandunyawiji.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name posyandunyawiji.my.id;
    return 404; # managed by Certbot
}
